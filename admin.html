<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة التحكم | بوابة المعرفة التقنية</title><style>
:root{--p:#6231ac;--pink:#f5d9e7}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;background:#fffaf7;color:#35264c;margin:0}header{background:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #ddd}h1{font-size:24px;color:var(--p)}main{max-width:920px;margin:24px auto;padding:0 16px}.box{background:white;border:1px solid #ead9e5;border-radius:18px;padding:22px;margin:18px 0}input,select,textarea{width:100%;padding:12px;border:1px solid #d6bed7;border-radius:10px;font:inherit;margin:6px 0 14px}textarea{min-height:150px}label{display:block;font-weight:bold}button,.btn{background:var(--p);color:white;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block;margin:4px}button.alt{background:#f7dce9;color:#4d2678}.warn{background:#fff4d8;padding:13px;border-radius:10px;line-height:1.9}#status{font-weight:bold;line-height:1.8}small{color:#75647e}a{color:var(--p)}.row{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none}.intro{color:#75647e;line-height:1.8}</style></head><body><header><h1>⚙️ لوحة التحكم</h1><a href="index.html">العودة للموقع</a></header><main>
<section class="box"><h2>دخول مدير النظام</h2><p class="intro">أهلًا بكِ، سجّلي الدخول لإدارة دروس البوابة.</p>
<label>رمز دخول المدير</label><input type="password" id="token" autocomplete="off" placeholder="أدخلي رمز الدخول"><button onclick="connect()">فتح لوحة التحكم</button><p id="status" role="status"></p></section>
<section id="editor" class="box hidden"><h2>إدارة الدروس</h2><label>القسم</label><select id="section" onchange="listLessons()"></select><label>الدرس</label><select id="lesson" onchange="loadLesson()"></select><label>عنوان الدرس</label><input id="title"><label>اسم الأداة</label><input id="tool"><label>رابط الأداة</label><input id="url"><label>خطوات الدرس (كل خطوة في سطر مستقل)</label><textarea id="steps"></textarea><div class="row"><button onclick="saveLesson()">حفظ الدرس</button><button class="alt" onclick="newLesson()">إضافة درس</button><button class="alt" onclick="removeLesson()">حذف الدرس</button></div><hr><button onclick="publish()">نشر التعديلات</button><p id="publishStatus" role="status"></p></section>
</main><script>
const owner='TechSkillGate',repo='tech-knowledge-portal',branch='main',path='content.json';let token='',sha='',data=null;const $=id=>document.getElementById(id);const status=(id,s)=>$(id).textContent=s;
function encode64(s){const bytes=new TextEncoder().encode(s);let b='';for(let i=0;i<bytes.length;i+=8192)b+=String.fromCharCode(...bytes.slice(i,i+8192));return btoa(b)}
function decode64(s){const b=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}
async function github(method,body){const res=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`,{method,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const j=await res.json();if(!res.ok)throw Error(j.message||'تعذر الاتصال بـ GitHub');return j}
async function connect(){token=$('token').value.trim();if(!token)return status('status','أدخلي رمز الوصول');try{status('status','جارٍ تسجيل الدخول...');const file=await github('GET');sha=file.sha;data=JSON.parse(decode64(file.content));if(!data.lessons)throw Error('صيغة ملف المحتوى غير صحيحة');$('token').value='';$('editor').classList.remove('hidden');$('section').innerHTML=Object.keys(data.lessons).filter(k=>k!=='prompts').map(k=>`<option value="${k}">${({design:'التصميم والإبداع',video:'صناعة الفيديو',ai:'الذكاء الاصطناعي',interactive:'التطبيقات التفاعلية',sites:'إنشاء المنصات التعليمية',skills:'المهارات التقنية',teacher:'أدوات المعلمة الذكية',notes:'ملفات الإنجاز والتنظيم'})[k]||k}</option>`).join('');listLessons();status('status','تم تسجيل الدخول بنجاح ✓')}catch(e){token='';status('status','تعذر تسجيل الدخول: '+e.message)}}
function listLessons(){const a=data.lessons[$('section').value]||[];$('lesson').innerHTML=a.map((it,i)=>{const op=document.createElement('option');op.value=i;op.textContent=it[0];return op.outerHTML}).join('');loadLesson()}
function loadLesson(){const a=data.lessons[$('section').value]||[],it=a[Number($('lesson').value)];$('title').value=it?.[0]||'';$('tool').value=it?.[1]||'';$('url').value=it?.[2]||'';$('steps').value=(it?.[3]||[]).join('\n')}
function saveLesson(){const a=data.lessons[$('section').value],i=Number($('lesson').value);if(!a[i])return alert('اختاري درسًا أو أضيفي درسًا جديدًا');if(!$('title').value.trim())return alert('عنوان الدرس مطلوب');a[i]=[$('title').value.trim(),$('tool').value.trim(),$('url').value.trim(),$('steps').value.split('\n').map(x=>x.trim()).filter(Boolean),a[i][4]||''];listLessons();$('lesson').value=i;loadLesson();status('publishStatus','تم حفظ الدرس. اضغطي «نشر التعديلات» لإظهاره في الموقع.')}
function newLesson(){const a=data.lessons[$('section').value];a.push(['درس جديد','','',[],'']);listLessons();$('lesson').value=a.length-1;loadLesson();$('title').focus()}
function removeLesson(){const a=data.lessons[$('section').value],i=Number($('lesson').value);if(!a[i]||!confirm('هل تريدين حذف هذا الدرس؟'))return;a.splice(i,1);listLessons();status('publishStatus','تم حذف الدرس. اضغطي «نشر التعديلات» لتطبيق الحذف.')}
async function publish(){if(!token||!data)return;try{status('publishStatus','جارٍ نشر التعديلات...');const body={message:'تحديث دروس بوابة المعرفة التقنية من لوحة التحكم',content:encode64(JSON.stringify(data,null,2)),sha,branch};const result=await github('PUT',body);sha=result.content.sha;status('publishStatus','تم إرسال التعديلات بنجاح ✓ ستظهر في الموقع بعد اكتمال النشر.')}catch(e){status('publishStatus','تعذر النشر: '+e.message+' — إذا تغير الملف من جهاز آخر، أعيدي فتح اللوحة لتحميل أحدث نسخة.')}}
window.addEventListener('pagehide',()=>{token=''});
</script></body></html>
