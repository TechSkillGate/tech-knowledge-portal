const initial=[{id:'design',name:'التصميم والإبداع',icon:'🎨',desc:'Canva وتصميم الشهادات والإعلانات',lessons:[{title:'تصميم شهادة شكر وتقدير باستخدام Canva',steps:['افتحي Canva وسجّلي الدخول، ثم اكتبي «شهادة تقدير» في البحث.','اختاري قالبًا مناسبًا ثم اضغطي على النص لتعديل العنوان واسم المستفيدة.','من «التحميلات» أضيفي شعار المدرسة وصورًا تملكين حق استخدامها.','عدّلي الخط والألوان وتحققي من سلامة الأسماء والتاريخ.','اختاري «مشاركة» ثم «تنزيل»، وحددي PDF للطباعة أو PNG للمشاركة.'],practice:'صممي شهادة تقدير لطالبة مع مكان لاسم المدرسة والتوقيع.'},{title:'إعداد قالب شهادة قابل للتكرار',steps:['افتحي Canva واختاري قالب شهادة مناسبًا.','اكتبي عنوان الشهادة ونص التقدير.','ضعي حقولًا واضحة لاسم المستفيدة والتاريخ والتوقيع.','أضيفي شعار المدرسة من التحميلات.','احفظي نسخة أصلية من التصميم قبل التعديل على الأسماء.','كرري الصفحة أو التصميم لتجهيز شهادات أخرى.','راجعي كل اسم قبل تنزيل الشهادة بصيغة PDF للطباعة.']},{title:'تصميم إعلان مدرسي',steps:['ابحثي عن قالب «إعلان» في Canva.','غيّري العنوان والتاريخ والمكان.','أضيفي أيقونات مناسبة، ثم راجعي النص واحفظيه PNG.'],practice:'صممي إعلانًا لورشة تقنية.'}]},{id:'video',name:'صناعة الفيديو',icon:'🎬',desc:'CapCut وتصميم الفيديوهات التعليمية',lessons:[{title:'إنشاء فيديو تعليمي باستخدام CapCut',steps:['افتحي CapCut واختاري مشروعًا جديدًا.','أضيفي الصور والمقاطع بالترتيب المطلوب.','استخدمي الخط الزمني لضبط مدة كل صورة وإضافة انتقالات بسيطة.','أضيفي العناوين والتعليق الصوتي، مع مراعاة خصوصية الطالبات.','راجعي الفيديو ثم صدّريه بصيغة MP4.'],practice:'أنشئي فيديو من 30 ثانية يلخص نشاطًا مدرسيًا.'}]},{id:'ai',name:'الذكاء الاصطناعي',icon:'🤖',desc:'Gemini وNotebookLM والقصص والملخصات',lessons:[{title:'إنشاء قصة إلكترونية مصورة باستخدام Gemini',steps:['افتحي gemini.google.com وسجّلي الدخول.','ابحثي عن ميزة Storybook إن كانت متاحة لحسابك.','اكتبي موضوع القصة والفئة العمرية والقيمة التربوية والشخصيات.','اطلبي لغة عربية بسيطة ورسومات مناسبة للأطفال.','راجعي دقة المحتوى والرسومات ثم شاركي القصة عبر الخيارات المتاحة.'],practice:'أنشئي قصة قصيرة عن الأمان الرقمي.'},{title:'NotebookLM: تحويل درس PDF إلى ملخص وفيديو',steps:['افتحي notebooklm.google.com وأنشئي دفترًا جديدًا.','اضغطي «إضافة مصدر» وارْفعي ملف PDF للدرس.','اكتبي في المحادثة: «لخّصي هذا الدرس بلغة سهلة مع المفاهيم والأمثلة».','لإنشاء ملخص صوتي افتحي Studio واختاري Audio Overview.','لإنشاء فيديو افتحي Studio واختاري Video Overview إذا كان متاحًا.','راجعي المخرجات مع المصدر، ثم استخدمي خيارات التنزيل أو المشاركة المتاحة.'],practice:'ارفعي درسًا قصيرًا وأنشئي ملخصًا من خمس نقاط وفيديو عند توفر الميزة.'}]},{id:'interactive',name:'التطبيقات التفاعلية',icon:'📱',desc:'Padlet وLiveworksheets',lessons:[{title:'إنشاء لوحة تفاعلية باستخدام Padlet',steps:['افتحي padlet.com وأنشئي لوحة جديدة.','اختاري تخطيطًا مناسبًا واكتبي عنوان اللوحة ووصفها.','أضيفي منشورًا تجريبيًا يحتوي على صورة أو رابط.','راجعي إعدادات الخصوصية والمشاركة قبل إرسال الرابط.'],practice:'أنشئي لوحة لأفكار الطالبات حول الاستخدام الآمن للإنترنت.'},{title:'إنشاء ورقة عمل تفاعلية باستخدام Liveworksheets',steps:['افتحي liveworksheets.com وأنشئي حسابًا حسب الخيارات المتاحة.','جهّزي ورقة العمل وحددي أنواع الأسئلة المدعومة.','أضيفي الإجابات الصحيحة وإعدادات التصحيح حيث تتوفر.','جرّبي الورقة قبل مشاركة رابطها.'],practice:'أنشئي ورقة قصيرة من خمسة أسئلة.'}]},{id:'sites',name:'إنشاء المنصات التعليمية',icon:'🌐',desc:'Google Sites ومنصات تعليمية تفاعلية',lessons:[{title:'إنشاء موقع تعليمي باستخدام Google Sites',steps:['افتحي sites.google.com وسجّلي الدخول.','أنشئي موقعًا فارغًا واكتبي عنوانه.','أضيفي صفحات للدروس والأنشطة وروابط للمصادر.','استخدمي «إدراج» لإضافة صور وأزرار وملفات.','راجعي معاينة الجوال ثم انشري الموقع وحددي من يستطيع الوصول إليه.'],practice:'أنشئي صفحة لدرس تحتوي على عنوان وصورة وزر نشاط.'}]},{id:'skills',name:'المهارات التقنية',icon:'🛡️',desc:'الأمن السيبراني وحلول تقنية سريعة وملفات PDF والصوت',lessons:[{title:'دمج ملفات PDF',steps:['اختاري أداة دمج موثوقة أو برنامجًا مثبتًا على الجهاز.','أضيفي الملفات المطلوبة بالترتيب.','راجعي الصفحات ثم اختاري دمج وحفظ الملف الجديد.','تجنبي رفع الم let settings=JSON.parse(localStorage.getItem('techPortalSettings')||'{}');let favoritesList=JSON.parse(localStorage.getItem('techFavorites')||'[]');function save(){localStorage.setItem(key,JSON.stringify(sections))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(id){['home','detail','admin'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}function home(){show('home');renderCards()}function renderCards(){const q=document.getElementById('search').value.trim().toLowerCase();document.getElementById('cards').innerHTML=sections.filter(s=>(s.name+' '+s.desc+' '+s.lessons.map(l=>l.title).join(' ')).toLowerCase().includes(q)).map(s=>`<article class="card"><div class="icon">${esc(s.icon)}</div><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p><button onclick="openSection('${s.id}')">عرض القسم ←</button></article>`).join('')||'<p>لا توجد نتائج مطابقة.</p>'}function openSection(id){let s=sections.find(x=>x.id===id);if(!s)return;show('detail');document.getElementById('detail').innerHTML=`<button class="secondary" onclick="home()">← العودة للأقسام</button><h2>${esc(s.icon)} ${esc(s.name)}</h2><p>${esc(s.desc)}</p>${s.id==='prompts'?promptBuilder():''}${s.lessons.map((l,i)=>`<div class="lesson"><h3>${esc(l.title)}</h3><h4>الشرح خطوة بخطوة</h4><ol>${l.steps.map(st=>`<li>${esc(st)}</li>`).join('')}</ol>${l.image?`<img src="${esc(l.image)}" style="max-width:100%;border-radius:12px" alt="صورة توضيحية">`:''}</div>`).join('')}`};function toggleFav(id,i){let k=id+':'+i;favoritesList=favoritesList.includes(k)?favoritesList.filter(x=>x!==k):[...favoritesList,k];localStorage.setItem('techFavorites',JSON.stringify(favoritesList));openSection(id)}function favorites(){show('detail');let arr=favoritesList.map(k=>{let [id,i]=k.split(':');let s=sections.find(x=>x.id===id);return s&&s.lessons[+i]?`<div class="lesson"><h3>${esc(s.lessons[+i].title)}</h3><button onclick="openSection('${id}')">عرض الشرح</button></div>`:''}).join('');document.getElementById('detail').innerHTML='<button onclick="home()">العودة</button><h2>♥ الأدوات المفضلة</h2>'+(arr||'<p>لم تضيفي أي شرح إلى المفضلة بعد.</p>')}function about(){show('detail');document.getElementById('detail').innerHTML=`<button onclick="home()">العودة</button><div class="panel" style="text-align:center"><h2>من نحن</h2><p style="text-align:center;line-height:2">بوابة المعرفة التقنية منصة تعليمية تهدف إلى نشر المعرفة التقنية وتنمية المهارات الرقمية لدى منسوبات المدرسة، من خلال شروحات مبسطة وتطبيقات عملية للأدوات الحديثة.</p><p style="text-align:center;margin-top:24px"><b>تحت إشراف مديرة المدرسة:</b> صفية الصاعدي </p><p style="text-align:center"><b>تصميم وتطوير الموقع:</b> ايناس الرحيلي </p></div>`}function contact(){show('detail');document.getElementById('detail').innerHTML=`<button onclick="home()">العودة</button><div class="panel"><h2>اتصل بنا</h2><p>للتواصل بشأن الشروحات أو اقتراح أدوات جديدة:</p>${settings.email?`<a href="mailto:${esc(settings.email)}">${esc(settings.email)}</a>`:'<p>سيُضاف بريد التواصل من لوحة التحكم.</p>'}</div>`}function promptBuilder(){return `<div class="panel"><h2>✨ مولّد البرومبتات التفاعلي</h2><label>نوع المهمة</label><select id="pt"><option>تصميم فيديو مدرسي</option><option>تصميم شهادة شكر</option><option>إنشاء قصة تعليمية</option><option>تلخيص درس</option><option>إنشاء منصة تعليمية</option><option>إعداد ورقة عمل</option><option>إعداد تقرير</option></select><label>العنوان أو الموضوع</label><input id="topic" placeholder="مثال: اليوم الوطني"><label>الفئة المستهدفة</label><input id="aud" placeholder="مثال: المرحلة الابتدائية"><label>تفاصيل إضافية</label><textarea id="extra" placeholder="المدة، الألوان، الأسلوب، عدد الصفحات..."></textarea><button onclick="generatePrompt()">✨ إنشاء البرومبت</button><textarea id="output" placeholder="سيظهر البرومبت هنا" readonly></textarea><button class="secondary" onclick="navigator.clipboard.writeText(document.getElementById('output').value).then(()=>alert('تم النسخ'))">📋 نسخ البرومبت</button></div>`}function generatePrompt(){let t=document.getElementById('pt').value,topic=document.getElementById('topic').value,a=document.getElementById('aud').value,e=document.getElementById('extra').value;document.getElementById('output').value=`تصرّف كخبير في ${t}. أنشئ محتوى احترافيًا باللغة العربية حول: ${topic||'[اكتبي الموضوع]'}. الفئة المستهدفة: ${a||'منسوبات المدرسة'}. التفاصيل: ${e||'استخدمي أسلوبًا واضحًا وجذابًا'}. قدم خطوات عملية مرتبة، ونصوصًا جاهزة، واقتراحات بصرية مناسبة، وراجع الدقة اللغوية، وتجنب افتراض معلومات غير متاحة.`}function adminLogin(){let pass=sessionStorage.getItem('adminUnlocked');if(pass==='yes'){adminPanel();return}let p=prompt('لوحة التحكم:  أدخلي رمز الدخول المحلي (الرمز الافتراضي: 1234)');if(p===null)return;if(p===(settings.password||'1234')){sessionStorage.setItem('adminUnlocked','yes');adminPanel()}else alert('رمز غير صحيح')}function adminPanel(){show('admin');document.getElementById('admin').innerHTML=`<h2>⚙️ لوحة التحكم — نسخة محلية</h2><p class="note">تنبيه: التعديلات محفوظة على هذا المتصفح فقط، ولا تُنشر تلقائيًا لجميع الزائرات. يلزم ربط الموقع بخدمة إدارة محتوى وتوثيق آمنة قبل النشر العام. رمز الدخول هنا تجريبي وليس حماية حقيقية.</p><div class="panel"><h3>إعدادات الواجهة</h3><label>اسم الموقع</label><input id="siteName" value="${esc(settings.title||'بوابة المعرفة التقنية')}"><label>اسم المصممة</label><input id="owner" value="${esc(settings.owner||'')}"><label>اسم المدرسة</label><input id="school" value="${esc(settings.school||'')}"><label>البريد للتواصل</label><input id="email" value="${esc(settings.email||'')}"><label>رابط صورة الشعار (اختياري)</label><input id="logo" value="${esc(settings.logo||'')}"><button onclick="saveSettings()">حفظ الإعدادات</button></div><div class="panel"><h3>إضافة قسم جديد</h3><input id="newSection" placeholder="اسم القسم"><input id="newIcon" placeholder="رمز مثل 📚"><input id="newDesc" placeholder="وصف مختصر"><button onclick="addSection()">إضافة القسم</button></div><div class="panel"><h3>إضافة شرح</h3><label>القسم</label><select id="sectionSelect">${sections.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><input id="lessonTitle" placeholder="عنوان الشرح"><textarea id="lessonSteps" placeholder="اكتبي كل خطوة في سطر مستقل"></textarea><input id="lessonImage" placeholder="رابط صورة توضيحية (اختياري)"><button onclick="addLesson()">حفظ الشرح</button></div><div class="panel"><h3>النسخ الاحتياطي</h3><button onclick="exportData()">تنزيل نسخة JSON من المحتوى</button><p class="note">يمكن استخدام النسخة الاحتياطية لاحقًا عند ربط نظام إدارة المحتوى.</p></div>`}function saveSettings(){settings={...settings,title:document.getElementById('siteName').value,owner:document.getElementById('owner').value,school:document.getElementById('school').value,email:document.getElementById('email').value,logo:document.getElementById('logo').value};localStorage.setItem('techPortalSettings',JSON.stringify(settings));applySettings();alert('تم الحفظ على هذا الجهاز')}function applySettings(){document.getElementById('siteTitle').textContent=settings.title||'بوابة المعرفة التقنية';if(settings.logo)document.getElementById('heroArt').innerHTML=`<img src="${esc(settings.logo)}" alt="شعار المدرسة" style="max-width:180px;max-height:180px"><div style="font-size:18px">${esc(settings.school||'')}</div>`;else document.getElementById('heroArt').innerHTML='<div class="laptop-visual"><img src="hero-lavender.jpg" alt="حاسوب وزهور اللافندر" class="hero-photo"><span class="laptop-title-fix">بوابة المعرفة التقنية</span></div>'}function addSection(){let name=document.getElementById('newSection').value.trim();if(!name)return alert('اكتبي اسم القسم');sections.push({id:'custom'+Date.now(),name,icon:document.getElementById('newIcon').value||'📚',desc:document.getElementById('newDesc').value,lessons:[]});save();adminPanel();alert('تمت الإضافة محليًا')}function addLesson(){let s=sections.find(x=>x.id===document.getElementById('sectionSelect').value);let title=document.getElementById('lessonTitle').value.trim();if(!title)return alert('اكتبي عنوان الشرح');s.lessons.push({title,steps:document.getElementById('lessonSteps').value.split('\n').filter(Boolean),image:document.getElementById('lessonImage').value});save();adminPanel();alert('تم حفظ الشرح محليًا')}function exportData(){let blob=new Blob([JSON.stringify({sections,settings},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tech-portal-backup.json';a.click();URL.revokeObjectURL(a.href)}

 const fallback=()=>{const area=document.createElement('textarea');area.value=content;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();let ok=document.execCommand('copy');area.remove();if(!ok)window.prompt('انسخي الخطوات:',content);else alert('تم نسخ خطوات الدرس ✓')};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(content).then(()=>alert('تم نسخ خطوات الدرس ✓')).catch(fallback)}else fallback();
}
function detailedSection(id){
 const s=sections.find(x=>x.id===id);if(!s)return;
 const items=detailedLibrary[id]||[];
 if(!items.length){openSectionOriginal(id);return}
 show('detail');const out=document.getElementById('detail');
 let content=`<button class="secondary" onclick="home()">← العودة للأقسام</button><h2>${esc(s.icon)} ${esc(s.name)}</h2><p>${esc(s.desc)}</p>`;
 content+=items.map((it,i)=>`<div class="lesson-jump"><a href="#guide-${id}-${i}">📖 ${esc(it[0])} ←</a></div>`).join('');
 content+=items.map((it,i)=>{let [title,tool,url,steps,practice]=it;let labels=[steps[0],steps[Math.floor(steps.length/2)],steps[steps.length-1]];return `<article class="guide-card" id="guide-${id}-${i}"><h3>${esc(title)}</h3><div class="guide-meta"><span>🪄 ${esc(tool)}</span></div><p class="lesson-intro">اتبعي الخطوات التالية بالترتيب.</p><h4>الخطوات التفصيلية</h4><div class="visual-steps">${steps.map((st,n)=>`<section class="visual-step"><div class="step-explanation"><span class="step-count">الخطوة ${n+1}</span><p>${esc(st)}</p></div></section>`).join('')}</div>${title.includes('برومبت')?'':videoForLesson(title,tool)}<div class="guide-links">${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">🔗 فتح ${esc(tool)}</a>`:''}<button class="secondary copy-steps" onclick="copyLessonSteps('${id}',${i})">📋 نسخ الخطوات</button><button class="secondary" onclick="window.print()">🖨️ طباعة الشرح</button><button class="secondary" onclick="shareLesson('${id}',${i})">🔗 مشاركة الدرس</button>${i<items.length-1?`<button onclick="goToNextLesson('${id}',${i+1})">التالي ←</button>`:`<button class="secondary" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ العودة للأعلى</button>`}</div></article>`}).join('');
 if(id==='ai')content+=`<section class="guide-card"><h3>✨ مكتبة البرومبتات</h3>${promptBuilder()}</section>`;
 // User-created lessons remain visible below the curated lessons.
 const own=s.lessons.filter(l=>!items.some(it=>it[0]===l.title));if(own.length && !['design','video','ai','interactive','sites','skills','notes'].includes(id))content+=`<h2>شروحات إضافية</h2>`+own.map(l=>`<article class="guide-card"><h3>${esc(l.title)}</h3><ol>${(l.steps||[]).map(st=>`<li>${esc(st)}</li>`).join('')}</ol><p>${esc(l.practice||'')}</p></article>`).join('');
 out.innerHTML=content;
}
const openSectionOriginal=openSection;
openSection=detailedSection;
// Correct category descriptions and ensure lessons are searchable.
if(detailedLibrary.ai&&detailedLibrary.prompts)detailedLibrary.ai=[...detailedLibrary.ai,...detailedLibrary.prompts];
for(const s of sections){if(detailedLibrary[s.id]){s.lessons=detailedLibrary[s.id].map(it=>({title:it[0],steps:it[3],practice:it[4]})).concat(s.lessons.filter(l=>!detailedLibrary[s.id].some(it=>it[0]===l.title)));}}
renderCards();
</script>
<button id="backToTop" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="العودة للأعلى">↑ العودة للأعلى</button><script>
function goToNextLesson(id,index){const el=document.getElementById('guide-'+id+'-'+index);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#guide-'+id+'-'+index);}}
async function shareLesson(id,index){
 const anchor='guide-'+id+'-'+index;
 const node=document.getElementById(anchor);
 const title=node?.querySelector('h3')?.textContent||'درس من بوابة المعرفة التقنية';
 const url=location.href.split('#')[0]+'#'+anchor;
 try{
   if(navigator.share){await navigator.share({title,text:'بوابة المعرفة التقنية',url});return;}
   if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);alert('تم نسخ رابط الدرس ✓');return;}
   const t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(ok)alert('تم نسخ رابط الدرس ✓');else prompt('انسخي رابط الدرس:',url);
 }catch(e){if(e.name!=='AbortError')prompt('انسخي رابط الدرس:',url);}
}
window.addEventListener('scroll',()=>{document.getElementById('backToTop')?.classList.toggle('visible',window.scrollY>350)},{passive:true});
window.addEventListener('load',()=>{if(location.hash.startsWith('#guide-')){const parts=location.hash.slice(7).split('-');const id=parts.slice(0,-1).join('-');const index=Number(parts.at(-1));if(typeof detailedSection==='function'&&Number.isInteger(index)){detailedSection(id);setTimeout(()=>document.getElementById(location.hash.slice(1))?.scrollIntoView(),80);}}});
</script></body></html>
